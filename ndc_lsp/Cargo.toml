# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
name = "ndc_lsp"
edition.workspace = true
version.workspace = true

[features]
default = ["server"]
# The language server over stdio. Without it, the features (completion, hover,
# diagnostics, …) are plain functions over a `Document`, which also build for
# WebAssembly.
server = ["dep:tokio", "dep:tower-lsp"]

[dependencies]
ndc_analysis.workspace = true
ahash.workspace = true
lsp-types.workspace = true
ndc_lexer.workspace = true
ndc_interpreter.workspace = true
ndc_core.workspace = true
ndc_parser.workspace = true
tokio = { version = "1.52.3", features = ["full"], optional = true }
tower-lsp = { workspace = true, optional = true }

[dev-dependencies]
ndc_stdlib.workspace = true
