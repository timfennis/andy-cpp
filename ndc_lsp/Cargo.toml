# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
name = "ndc_lsp"
edition.workspace = true
version.workspace = true

[features]
default = ["server"]
# The language server over stdio. Without it, the features (completion, hover,
# diagnostics, …) are plain functions over a `Document`, which also build for
# WebAssembly.
server = ["dep:crossbeam-channel", "dep:lsp-server", "dep:serde_json"]

[dependencies]
ndc_analysis.workspace = true
ls-types.workspace = true
ndc_lexer.workspace = true
ndc_interpreter.workspace = true
ndc_core.workspace = true
ndc_parser.workspace = true
ndc_fmt.workspace = true
ndc_layout.workspace = true
ndc_resolver.workspace = true
crossbeam-channel = { workspace = true, optional = true }
lsp-server = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
ndc_stdlib.workspace = true
