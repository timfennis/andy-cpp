# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
name = "ndc_interpreter"
edition.workspace = true
version.workspace = true

[features]
trace = ["ndc_vm/trace"]

[dependencies]
ndc_analyser.workspace = true
ndc_analysis.workspace = true
ndc_core.workspace = true
ndc_vm = { workspace = true }
ndc_lexer.workspace = true
ndc_parser.workspace = true
thiserror.workspace = true

# `std::time::Instant` panics in the browser; `web-time` reads `performance.now()`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
web-time = "1.1.0"
