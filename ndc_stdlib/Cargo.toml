[package]
name = "ndc_stdlib"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
factorial.workspace = true
itertools.workspace = true
ndc_core.workspace = true
ndc_macros.workspace = true
ndc_vm = { workspace = true }
num.workspace = true

# Optional
once_cell = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
tap = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Crypto
md5 = { version = "0.8.0", optional = true }
sha1 = { version = "0.11.0", optional = true }

[dev-dependencies]
ndc_analyser.workspace = true

[features]
default = ["crypto", "rand", "regex", "serde"]
crypto = ["dep:md5", "dep:sha1"]
rand = ["dep:rand", "dep:tap"]
regex = ["dep:regex", "dep:once_cell"]
serde = ["dep:serde_json"]
