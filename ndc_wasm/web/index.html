<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andy C++ Playground</title>
  <style>
    :root {
      --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6860;
      --line: #e3e0d8; --accent: #c2410c; --error: #b42318; --selection: rgba(64, 120, 242, .22);
      --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
      /* One Light */
      --tok-string: #50a14f; --tok-literal: #986801; --tok-keyword: #e45649; --tok-function: #b07100;
      --tok-variable: #4078f2; --tok-assignment: #0184bc; --tok-punctuation: #696c77;
      --tok-operator: #a626a4; --tok-comment: #a0a1a7; --tok-invalid: #e45649;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1d22; --panel: #282c34; --ink: #abb2bf; --muted: #7f848e;
        --line: #3a3f4b; --accent: #e5935b; --error: #f97066; --selection: rgba(97, 175, 239, .25);
        /* One Dark, as the REPL colours it */
        --tok-string: #98c379; --tok-literal: #d19a66; --tok-keyword: #e06c75; --tok-function: #e5c07b;
        --tok-variable: #61afef; --tok-assignment: #56b6c2; --tok-punctuation: #abb2bf;
        --tok-operator: #c678dd; --tok-comment: #7f848e; --tok-invalid: #e06c75;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif;
    }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 16px; margin: 0; font-weight: 600; }
    h1 span { color: var(--accent); }
    .status { color: var(--muted); font-size: 13px; margin-right: auto; }
    button {
      font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    kbd { font: 12px var(--mono); color: var(--muted); }
    main { display: grid; grid-template-columns: 1fr 1fr; flex: 1; min-height: 0; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      kbd { display: none; }
    }

    /* The editor: a transparent textarea over the highlighted code. Both must
       lay text out identically, so they share every metric below. */
    .editor { position: relative; min-width: 0; background: var(--panel); border-right: 1px solid var(--line); }
    .editor > * {
      position: absolute; inset: 0; margin: 0; padding: 16px; border: 0;
      font: 14px/1.55 var(--mono); tab-size: 4; letter-spacing: 0;
      white-space: pre; overflow-wrap: normal;
    }
    /* The textarea's scrollbars let it scroll further than the bare <pre>;
       extra room at the end lets the <pre> always follow. */
    .editor pre {
      overflow: hidden; pointer-events: none; color: var(--ink);
      padding-bottom: 64px; padding-right: 64px;
    }
    .editor textarea {
      overflow: auto; resize: none; outline: none; background: transparent;
      color: transparent; caret-color: var(--ink);
    }
    .editor textarea::selection { background: var(--selection); }

    #out {
      margin: 0; padding: 16px; overflow: auto; min-width: 0;
      font: 14px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word;
    }
    .error { color: var(--error); }
    .meta { color: var(--muted); }

    .tok-string { color: var(--tok-string); }
    .tok-literal { color: var(--tok-literal); }
    .tok-keyword { color: var(--tok-keyword); }
    .tok-function { color: var(--tok-function); }
    .tok-variable { color: var(--tok-variable); }
    .tok-assignment { color: var(--tok-assignment); }
    .tok-punctuation { color: var(--tok-punctuation); }
    .tok-operator { color: var(--tok-operator); }
    .tok-comment { color: var(--tok-comment); font-style: italic; }
    .tok-invalid { color: var(--tok-invalid); text-decoration: wavy underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <header>
    <h1>Andy <span>C++</span></h1>
    <span class="status" id="status">Loading interpreter…</span>
    <kbd>Ctrl+Enter</kbd>
    <button id="stop" disabled>Stop</button>
    <button id="run" class="primary" disabled>Run</button>
  </header>
  <main>
    <div class="editor">
      <pre id="highlight" aria-hidden="true"></pre>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" aria-label="Code">// Andy C++, compiled to WebAssembly and running in your browser.
fn fib(n: Int) -> Int {
    if n < 2 { n } else { fib(n - 1) + fib(n - 2) }
}

for i in 0..15 {
    print("fib", i, "=", fib(i));
}

shuffled([1, 2, 3, 4, 5])</textarea>
    </div>
    <pre id="out"></pre>
  </main>
  <script type="module">
    import init, { highlight } from "./pkg/ndc_wasm.js";

    const $ = (id) => document.getElementById(id);
    const code = $("code"), shown = $("highlight"), out = $("out");
    const runButton = $("run"), stopButton = $("stop"), status = $("status");

    // Highlighting runs here rather than in the worker, so it keeps up while
    // a program runs and survives the worker being stopped.
    let highlighter = null;
    const escape = (text) => text.replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
    const asHtml = (text) => {
      if (!highlighter) return escape(text);
      try { return highlighter(text); } catch { return escape(text); }
    };

    let pending = false;
    function render() {
      pending = false;
      // A trailing newline needs something after it, or the <pre> is a line
      // shorter than the textarea and the two scroll apart.
      shown.innerHTML = asHtml(code.value) + (code.value.endsWith("\n") ? " " : "");
      syncScroll();
    }
    const scheduleRender = () => { if (!pending) { pending = true; requestAnimationFrame(render); } };
    function syncScroll() {
      shown.scrollTop = code.scrollTop;
      shown.scrollLeft = code.scrollLeft;
    }
    code.addEventListener("input", scheduleRender);
    code.addEventListener("scroll", syncScroll);
    render();
    init().then(() => { highlighter = highlight; render(); });

    // execCommand("insertText") keeps the browser's undo history intact.
    const insert = (text) => document.execCommand("insertText", false, text);
    code.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        run();
      } else if (e.key === "Enter" && !e.shiftKey && !e.altKey) {
        e.preventDefault();
        const lineStart = code.value.lastIndexOf("\n", code.selectionStart - 1) + 1;
        const indent = code.value.slice(lineStart).match(/^[ \t]*/)[0];
        insert("\n" + indent);
      } else if (e.key === "Tab" && !e.shiftKey) {
        e.preventDefault();
        insert("    ");
      }
    });

    let worker;
    function startWorker() {
      worker?.terminate();
      worker = new Worker("./worker.js", { type: "module" });
      runButton.disabled = true;
      worker.onmessage = ({ data }) => {
        if (data.ready) {
          status.textContent = "Ready";
          runButton.disabled = false;
          return;
        }
        show(data);
        stopButton.disabled = true;
        if (data.crashed) startWorker(); else runButton.disabled = false;
      };
      worker.onerror = (e) => {
        show({ output: "", value: "", error: `Worker failed: ${e.message}`, millis: 0 });
        startWorker();
      };
    }

    function show({ output, value, error, millis }) {
      let html = escape(output);
      if (value) html += (output && !output.endsWith("\n") ? "\n" : "") + asHtml(value) + "\n";
      if (error) html += `<span class="error">${escape(error)}</span>`;
      out.innerHTML = html;
      status.textContent = `Finished in ${millis.toFixed(1)} ms`;
    }

    function run() {
      if (runButton.disabled) return;
      runButton.disabled = true;
      stopButton.disabled = false;
      status.textContent = "Running…";
      worker.postMessage(code.value);
    }

    runButton.onclick = run;
    stopButton.onclick = () => {
      stopButton.disabled = true;
      out.innerHTML = `<span class="meta">Stopped.</span>\n`;
      status.textContent = "Restarting…";
      startWorker();
    };

    startWorker();
  </script>
</body>
</html>
