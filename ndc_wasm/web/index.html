<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andy C++ Playground</title>
  <style>
    :root {
      --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6860;
      --line: #e3e0d8; --accent: #c2410c; --error: #b42318;
      --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161512; --panel: #1e1d1a; --ink: #ebe8e0; --muted: #9a968c;
        --line: #33312c; --accent: #fb923c; --error: #f97066;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif;
    }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 16px; margin: 0; font-weight: 600; }
    h1 span { color: var(--accent); }
    .status { color: var(--muted); font-size: 13px; margin-right: auto; }
    button {
      font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    main { display: grid; grid-template-columns: 1fr 1fr; flex: 1; min-height: 0; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
    textarea, pre {
      margin: 0; padding: 16px; font: 14px/1.55 var(--mono); tab-size: 4;
      border: 0; overflow: auto; min-width: 0;
    }
    textarea { resize: none; outline: none; background: var(--panel); color: var(--ink); border-right: 1px solid var(--line); }
    pre { white-space: pre-wrap; word-break: break-word; }
    .value { color: var(--accent); }
    .error { color: var(--error); }
    .meta { color: var(--muted); }
    kbd { font: 12px var(--mono); color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Andy <span>C++</span></h1>
    <span class="status" id="status">Loading interpreter…</span>
    <kbd>Ctrl+Enter</kbd>
    <button id="stop" disabled>Stop</button>
    <button id="run" class="primary" disabled>Run</button>
  </header>
  <main>
    <textarea id="code" spellcheck="false">// Andy C++, compiled to WebAssembly and running in your browser.
fn fib(n: Int) -> Int {
    if n < 2 { n } else { fib(n - 1) + fib(n - 2) }
}

for i in 0..15 {
    print("fib", i, "=", fib(i));
}

shuffled([1, 2, 3, 4, 5])</textarea>
    <pre id="out"></pre>
  </main>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const code = $("code"), out = $("out"), runButton = $("run"), stopButton = $("stop"), status = $("status");
    let worker;

    function startWorker() {
      worker?.terminate();
      worker = new Worker("./worker.js", { type: "module" });
      runButton.disabled = true;
      worker.onmessage = ({ data }) => {
        if (data.ready) {
          status.textContent = "Ready";
          runButton.disabled = false;
          return;
        }
        show(data);
        stopButton.disabled = true;
        if (data.crashed) startWorker(); else runButton.disabled = false;
      };
      worker.onerror = (e) => {
        show({ output: "", value: "", error: `Worker failed: ${e.message}`, millis: 0 });
        startWorker();
      };
    }

    function show({ output, value, error, millis }) {
      out.replaceChildren();
      const add = (text, cls) => {
        if (!text) return;
        const span = document.createElement("span");
        span.textContent = text;
        if (cls) span.className = cls;
        out.append(span);
      };
      add(output);
      if (value) add((output && !output.endsWith("\n") ? "\n" : "") + value + "\n", "value");
      add(error, "error");
      status.textContent = `Finished in ${millis.toFixed(1)} ms`;
    }

    function run() {
      if (runButton.disabled) return;
      runButton.disabled = true;
      stopButton.disabled = false;
      status.textContent = "Running…";
      worker.postMessage(code.value);
    }

    runButton.onclick = run;
    stopButton.onclick = () => {
      stopButton.disabled = true;
      out.replaceChildren(Object.assign(document.createElement("span"), { className: "meta", textContent: "Stopped.\n" }));
      status.textContent = "Restarting…";
      startWorker();
    };
    code.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
      if (e.key === "Tab") {
        e.preventDefault();
        const { selectionStart: s, selectionEnd: end } = code;
        code.setRangeText("    ", s, end, "end");
      }
    });

    startWorker();
  </script>
</body>
</html>
