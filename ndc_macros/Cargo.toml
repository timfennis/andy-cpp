[package]
name = "ndc_macros"
version = "0.1.0"
edition = "2024"
authors = ["Tim Fennis <fennis.tim@gmail.com>"]
license = "MIT"

[lib]
proc-macro = true

[dependencies]
# Parses `signature = "…"` while the macro expands, so a bad one is a compile error.
ndc_core.workspace = true
proc-macro2 = "1.0.106"
quote = "1.0.46"
syn = { version = "2.0.118", features = ["full", "extra-traits"] }
