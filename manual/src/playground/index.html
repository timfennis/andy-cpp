<!doctype html>
<html lang="en" class="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andy C++ Playground</title>
  <script>
    // Dark or light: from ?theme= when the manual embeds this page, else from
    // the system. The classes are mdBook's, which andy.css colours code by.
    const forced = new URLSearchParams(location.search).get("theme");
    const systemDark = matchMedia("(prefers-color-scheme: dark)");
    function setTheme(theme) {
      document.documentElement.className = theme === "dark" ? "coal" : "light";
    }
    setTheme(forced ?? (systemDark.matches ? "dark" : "light"));
    if (!forced) systemDark.addEventListener("change", (e) => setTheme(e.matches ? "dark" : "light"));
    addEventListener("message", (e) => {
      if (e.origin === location.origin && e.data?.theme) setTheme(e.data.theme);
    });
  </script>
  <link rel="stylesheet" href="andy.css">
  <style>
    :root {
      --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6860; --line: #e3e0d8; --accent: #c2410c;
    }
    :root.coal {
      --bg: #1b1d22; --panel: #282c34; --ink: #abb2bf; --muted: #7f848e; --line: #3a3f4b; --accent: #e5935b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif;
    }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    h1 { font-size: 16px; margin: 0; font-weight: 600; }
    h1 span { color: var(--accent); }
    .status { color: var(--muted); font-size: 13px; margin-right: auto; }
    button {
      font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    kbd { font: 12px ui-monospace, monospace; color: var(--muted); }
    main { display: grid; grid-template-columns: 1fr 1fr; flex: 1; min-height: 0; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      kbd { display: none; }
    }
    .ndc-editor { background: var(--panel); border-right: 1px solid var(--line); }
    #out {
      margin: 0; padding: 16px; overflow: auto; min-width: 0;
      font: 14px/1.55 ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
      white-space: pre-wrap; word-break: break-word;
    }
  </style>
</head>
<body>
  <header>
    <h1>Andy <span>C++</span></h1>
    <span class="status" id="status">Loading interpreter…</span>
    <kbd>Ctrl+Enter</kbd>
    <button id="stop" disabled>Stop</button>
    <button id="run" class="primary" disabled>Run</button>
  </header>
  <main>
    <div id="editor"></div>
    <pre id="out"></pre>
  </main>
  <script type="module">
    import { load, Runner, createEditor, resultHtml, codeFromHash } from "./andy.js";

    const welcome = `// Andy C++, compiled to WebAssembly and running in your browser.
fn fib(n: Int) -> Int {
    if n < 2 { n } else { fib(n - 1) + fib(n - 2) }
}

for i in 0..15 {
    print("fib", i, "=", fib(i));
}

shuffled([1, 2, 3, 4, 5])
`;
    const $ = (id) => document.getElementById(id);
    const out = $("out"), runButton = $("run"), stopButton = $("stop"), status = $("status");
    const runner = new Runner();
    const editor = createEditor($("editor"), { code: codeFromHash() ?? welcome, onRun: run });
    addEventListener("hashchange", () => {
      const code = codeFromHash();
      if (code !== null) editor.value = code;
    });

    async function run() {
      if (runButton.disabled) return;
      runButton.disabled = true;
      stopButton.disabled = false;
      status.textContent = "Running…";
      const result = await runner.run(editor.value);
      out.innerHTML = resultHtml(result);
      status.textContent = result.stopped ? "Stopped"
        : result.millis === undefined ? "Failed"
        : `Finished in ${result.millis.toFixed(1)} ms`;
      runButton.disabled = false;
      stopButton.disabled = true;
    }

    runButton.onclick = run;
    stopButton.onclick = () => runner.stop();
    load().then(() => {
      status.textContent = "Ready";
      runButton.disabled = false;
    });
    editor.focus();
  </script>
</body>
</html>
