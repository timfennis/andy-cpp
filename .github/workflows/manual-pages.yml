name: Manual Pages

on:
  push:
    branches:
      - master
    # The manual runs its examples on the interpreter compiled to
    # WebAssembly, so a change to the interpreter redeploys it too.
    paths:
      - "manual/**"
      - "ndc_*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/manual-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The CLI must be the exact version of the wasm-bindgen crate in Cargo.lock.
      - name: Find the wasm-bindgen version
        id: wasm-bindgen
        run: |
          id=$(cargo pkgid wasm-bindgen)
          echo "version=${id##*@}" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Build the interpreter for the browser
        run: ./ndc_wasm/build.sh

      # npm only runs inside the container build.sh pins, from the lockfile,
      # with install scripts off; the runner itself never installs packages.
      - name: Bundle the playground's editor
        run: ./manual/editor/build.sh

      - name: Build manual
        run: mdbook build manual

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: manual/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
