[workspace]
resolver = "3"
members = ["ndc_macros", "ndc_bin", "ndc_diagnostics", "ndc_highlight", "ndc_wasm", "ndc_core", "ndc_analyser", "ndc_resolver", "ndc_layout", "ndc_analysis", "ndc_interpreter", "ndc_vm", "ndc_lsp", "ndc_lexer", "ndc_parser", "ndc_fmt", "ndc_stdlib", "benches", "tests/functional", "tests/compiler", "tests/proptest"]

# Fat LTO with one codegen unit starts the interpreter about 0.4 ms sooner, as
# the binary is 9 MB rather than 13 MB, and runs programs 2-7% faster. A
# release build after a change in ndc_core takes about a minute rather than 13
# seconds. Thin LTO gains neither.
[profile.release]
lto = "fat"
codegen-units = 1

[profile.release-with-debug]
inherits = "release"
debug = true

[workspace.package]
edition = "2024"
version = "0.4.1"
license = "MIT"

[workspace.dependencies]
char_index = "0.1.6"
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
derive_more = { version = "2.1.1", features = ["deref", "deref_mut", "from", "display", "constructor"] }
factorial = "0.4.0"
foldhash = "0.2.0"
hashbrown = { version = "0.17.1", default-features = false }
itertools = "0.15.0"
libc = "0.2.191"
ndc_core = { path = "ndc_core" }
ndc_diagnostics = { path = "ndc_diagnostics" }
ndc_fmt = { path = "ndc_fmt" }
ndc_highlight = { path = "ndc_highlight" }
ndc_lexer = { path = "ndc_lexer" }
ndc_analyser = { path = "ndc_analyser" }
ndc_resolver = { path = "ndc_resolver" }
ndc_layout = { path = "ndc_layout" }
ndc_analysis = { path = "ndc_analysis" }
ndc_interpreter = { path = "ndc_interpreter" }
ndc_vm = { path = "ndc_vm" }
ndc_parser = { path = "ndc_parser" }
ndc_lsp = { path = "ndc_lsp" }
ndc_macros = { path = "ndc_macros" }
ndc_stdlib = { path = "ndc_stdlib" }
num = "0.4.3"
proptest = "1.12"
yansi = { version = "1.0.1", features = ["detect-tty", "detect-env"] }
rand = "0.10.4"
rand_chacha = "0.10.0"
regex = "1.13.1"
rustc-hash = "2.1.3"
rustyline = { version = "19.0.0", features = ["derive"] }
ryu = "1.0.23"
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
strsim = "0.11.1"
tap = "1.0.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-lsp-server = "0.23.0"
# The version tower-lsp-server re-exports, so the server and the features share types.
ls-types = "0.0.6"

# For the browser build: LTO makes the module about 10% smaller and a bit
# faster. opt-level "s" or "z" would save another 12-21% of the gzipped size,
# but programs would run a quarter to a third slower.
[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1
